[package]
name = "things-kanban"
version = "0.1.0"
description = "A safe Things 3 Kanban board"
edition = "2021"
rust-version = "1.89"

[lib]
name = "things_kanban_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "things-kanban"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
